<ion-header>
  <ion-toolbar>
    <ion-title>
      HOME
    </ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

  <ion-button shape="round" (click)="goBack()">Ir al intro</ion-button>

<ion-content [style.--background]="colorActual">
  <swiper-container
  pagination='true'
  loop='true'
  >

    <swiper-slide *ngFor="let album of albums">
    <div class="slide-content">
      <img [src]="album.image"/>
      <p>{{ album.name }}</p>
    </div>

  </swiper-slide>

</swiper-container>



<div>
  <h3>demo ionic storage</h3>
  <div [style.background-color]="colorActual">
    <p>Tema actual: {{ colorActual === coloruno ? 'Azul' : 'Negro'}}</p>

  </div>
</div>

<div>
  <ion-button shape="round" (click)="cambiarcolor()">Cambiar Tema y Guardar</ion-button>
</div>

</ion-content>
