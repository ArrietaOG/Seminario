<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-content">

  <div class="login-box">

  <figure class="profile-default-img">
    <p>Ingresa tus datos</p>
    <img src="https://static.vecteezy.com/system/resources/previews/024/983/914/non_2x/simple-user-default-icon-free-png.png">
  </figure>

  <form [formGroup]="loginForm" (ngSubmit)="loginUser()">
    <ion-item class="input-item">
      <ion-input label="Email" labelPlacement="floating" placeholder="Escribe tu email" formControlName="email">
        <div slot="label">Email <ion-text color="danger">(Required)</ion-text></div>
      </ion-input>
    </ion-item>
    <div>
      <ng-container *ngFor="let validation of validation_messages.email">
        <div class="error-message" 
        *ngIf="(loginForm.get('email')?.hasError(validation.type) && loginForm.get('email')?.dirty )">
          {{validation.message}}
        </div>
      </ng-container>
    </div>

<ion-item class="input-item">

  <ion-input
    [type]="mostrarPassword ? 'text' : 'password'"
    label="Contraseña"
    labelPlacement="floating"
    placeholder="Escribe tu Contraseña"
    formControlName="password">
  </ion-input>

  <ion-button fill="clear" slot="end" (click)="togglePassword()">
    <ion-icon [name]="mostrarPassword ? 'eye-off' : 'eye'"></ion-icon>
  </ion-button>

</ion-item>


      <div>
      <ng-container *ngFor="let validation of validation_messages.password">
        <div class="error-message"
         *ngIf="(loginForm.get('password')?.hasError(validation.type) && loginForm.get('password')?.dirty )">
          {{validation.message}}
        </div>
      </ng-container>
    </div>
      <ion-button
  expand="full"
  shape="round"
  color="success"
  [disabled]="!loginForm.valid"
  type="submit"
  >
    Iniciar sesion
  </ion-button>
  </form>

<div class="register-card">
  <p>¿No tienes cuenta?</p>
  <ion-button fill="outline" shape="round" (click)="goToRegister()">
    Crear cuenta
  </ion-button>
</div>
</div>



  {{errorMessage}}
</ion-content>
