<ion-header>
  <ion-toolbar color="primary">

    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Favoritos ❤️</ion-title>

  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-list>
    <ion-item *ngFor="let song of favorites">
      <ion-label>{{ song.name }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
